<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="./style.css" />

    <title>All Day Long</title>
  </head>

  <body>
    <div class="wrapper">
      <div class="container"></div>
    </div>

    <details class="settings">
      <summary>settings</summary>

      <div class="controls">
        <label>
          duration
          <input id="duration" type="number" />
        </label>

        <label>
          fragment width
          <input id="fragment-width" type="number" />
        </label>

        <label>
          fragment height
          <input id="fragment-height" type="number" />
        </label>

        <label>
          perimeter
          <input id="perimeter" type="number" />
        </label>

        <label>
          radius
          <input id="radius" type="range" />
        </label>

        <label>
          rotate x
          <input id="rotate-x" type="range" />
        </label>

        <label>
          rotate y
          <input id="rotate-y" type="range" />
        </label>

        <label>
          rotate z
          <input id="rotate-z" type="range" />
        </label>

        <button id="reset">reset</button>

        <hr />

        <!-- prettier-ignore -->
        <span>Coded recreation of<br /><a href="https://dribbble.com/franziskavolmer" target="_blank" rel="noopener noreferrer">Franziska Volmer</a>'s <a href="https://dribbble.com/shots/10692303-All-Day-Long" target="_blank" rel="noopener noreferrer">All Day Long</a>.</span>
        <!-- prettier-ignore -->
        <span><a href="https://blog.felipeog.com.br/en/blog/all-day-long/introducao?utm_source=codepen&utm_medium=social" target="_blank" rel="noopener noreferrer">Read the blog post</a>.</span>
      </div>
    </details>

    <script src="./script.js"></script>
  </body>
</html>
